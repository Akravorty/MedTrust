services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env            # copy .env.example to .env first
    environment:
      # Services call each other over HTTP; inside the container that is localhost.
      LEDGER_BASE_URL: http://localhost:8000

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
